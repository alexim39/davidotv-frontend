name: design-guard

on:
  push:
    branches: [master, main]
    paths:
      - 'projects/tv/src/**'
      - 'scripts/token-guard.js'
      - 'package.json'
  pull_request:
    paths:
      - 'projects/tv/src/**'
      - 'scripts/token-guard.js'
      - 'package.json'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:tokens
      - run: npm run typecheck
